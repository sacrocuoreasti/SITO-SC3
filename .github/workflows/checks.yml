name: Stability checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python scripts/check_release.py
      - run: python -m unittest discover -s tests -v
      - run: node --check static/js/app.js
      - run: node --check static/js/group-calendar.js
      - run: node tests/test_frontend.js
      - run: node tests/test_google_script.js
      - run: node tests/test_family_frontend.js
